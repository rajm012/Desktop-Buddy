name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libegl1
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Formatting, tests and package build
        run: ./scripts/check.sh
